<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>División por 2 Cifras: Cajas Grandes con Pilas Verticales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Three.js + OrbitControls + Canvas Confetti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --c-color: #bbf7d0;
      --c-text: #15803d;
      --d-color: #fef08a;
      --d-text: #854d0e;
      --u-color: #bae6fd;
      --u-text: #0369a1;
      --grid-border: #cbd5e1;
      --panel-bg: rgba(255, 255, 255, 0.96);
      --panel-border: #e2e8f0;
      --primary: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at 50% 20%, #fdfbf7 0%, #f1f5f9 60%, #e2e8f0 100%);
      color: #0f172a;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Barra Superior */
    header {
      position: absolute;
      top: 12px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .config-card {
      pointer-events: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      padding: 6px 14px;
      border-radius: 18px;
      border: 2px solid var(--panel-border);
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .input-grp {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      font-size: 13px;
      color: #334155;
    }

    .num-input {
      width: 68px;
      padding: 4px 6px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: #0369a1;
      font-family: 'Fredoka', cursive;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 7px 13px;
      border-radius: 12px;
      font-family: 'Fredoka', cursive;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: #0369a1;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1.5px solid #cbd5e1;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* Muelle Escolar */
    .school-dock {
      position: absolute;
      top: 68px;
      left: 16px;
      z-index: 10;
      display: flex;
      gap: 12px;
      pointer-events: auto;
      max-width: calc(100vw - 32px);
    }

    .steps-card {
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      border: 2px solid var(--panel-border);
      padding: 14px;
      width: 310px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .steps-header {
      font-family: 'Fredoka', cursive;
      font-size: 15px;
      color: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 6px;
    }

    .timeline-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .timeline-steps::before {
      content: '';
      position: absolute;
      top: 12px;
      bottom: 12px;
      left: 13px;
      width: 2px;
      background: #e2e8f0;
      z-index: 1;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      position: relative;
      z-index: 2;
      opacity: 0.45;
      transition: all 0.25s ease;
    }

    .step-item.active { opacity: 1; }

    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      color: #1d4ed8;
      font-weight: 800;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-item.active .step-num {
      background: #0284c7;
      border-color: #0284c7;
      color: white;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25);
    }

    .step-desc {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      color: #334155;
    }

    /* Cuadrícula Escolar */
    .grid-card {
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      border: 2px solid var(--panel-border);
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .math-grid {
      display: grid;
      grid-template-columns: repeat(6, 40px);
      grid-template-rows: repeat(6, 40px);
      gap: 0;
      position: relative;
    }

    .grid-cell {
      border: 1px dashed var(--grid-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka', cursive;
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      position: relative;
    }

    .cell-c { background: var(--c-color); color: var(--c-text); border-style: solid; }
    .cell-d { background: var(--d-color); color: var(--d-text); border-style: solid; }
    .cell-u { background: var(--u-color); color: var(--u-text); border-style: solid; }
    .sub-digit { color: #b45309; }

    .divisor-line-v {
      position: absolute;
      width: 3px;
      background: #0f172a;
      z-index: 5;
    }

    .divisor-line-h {
      position: absolute;
      height: 3px;
      background: #0f172a;
      z-index: 5;
    }

    .minus-line {
      position: absolute;
      height: 3px;
      background: #0f172a;
      z-index: 4;
    }

    /* Barra Inferior */
    .bottom-toolbar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      padding: 9px 16px;
      border-radius: 28px;
      border: 2px solid var(--panel-border);
      box-shadow: 0 12px 36px rgba(0,0,0,0.08);
      pointer-events: auto;
      max-width: 95vw;
      overflow-x: auto;
    }

    .bank-live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 12px;
      color: #334155;
      white-space: nowrap;
    }

    .badge-pill {
      padding: 2px 6px;
      border-radius: 6px;
      font-family: 'Fredoka', cursive;
      font-size: 13px;
    }

    .pill-c { background: var(--c-color); color: var(--c-text); }
    .pill-d { background: var(--d-color); color: var(--d-text); }
    .pill-u { background: var(--u-color); color: var(--u-text); }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      border: none;
      outline: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-family: 'Fredoka', cursive;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .action-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-step { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .btn-pack-1 { background: linear-gradient(135deg, #059669, #047857); }
    .btn-split-c { background: linear-gradient(135deg, #16a34a, #15803d); }
    .btn-split-d { background: linear-gradient(135deg, #eab308, #ca8a04); color: #713f12; }
    .btn-split-box { background: linear-gradient(135deg, #d97706, #b45309); }
    .btn-split-bank { background: #64748b; }

    @media (max-width: 960px) {
      .school-dock { flex-direction: column; top: 105px; max-height: calc(100vh - 190px); overflow-y: auto; }
      .steps-card { width: 280px; }
      .math-grid { grid-template-columns: repeat(6, 32px); grid-template-rows: repeat(6, 32px); }
      .grid-cell { font-size: 1.15rem; }
      .bottom-toolbar { bottom: 8px; padding: 6px 10px; gap: 5px; }
      .action-btn { padding: 6px 10px; font-size: 11.5px; }
    }
  </style>
</head>
<body>

  <div id="webgl-container"></div>

  <header>
    <div class="config-card">
      <div class="input-grp">
        <span>Dividendo:</span>
        <input type="number" id="inpDividend" class="num-input" min="10" max="999" value="84">
      </div>
      <div class="input-grp">
        <span>Divisor:</span>
        <input type="number" id="inpDivisor" class="num-input" min="10" max="99" value="21">
      </div>
      <button class="btn" onclick="initSimulation()"><i class="fa-solid fa-play"></i> Resolver</button>
      <button class="btn btn-secondary" onclick="preset(84, 21)">84 ÷ 21 (21 por Caja)</button>
      <button class="btn btn-secondary" onclick="preset(144, 24)">144 ÷ 24 (Centena)</button>
      <button class="btn btn-secondary" onclick="preset(288, 24)">288 ÷ 24 (2 Centenas)</button>
      <button class="btn btn-secondary" onclick="preset(96, 32)">96 ÷ 32</button>
      <button class="btn btn-secondary" onclick="preset(68, 12)">68 ÷ 12</button>
    </div>
  </header>

  <!-- Muelle Escolar -->
  <div class="school-dock">
    <div class="steps-card">
      <div class="steps-header">
        <span id="stepsTitle">Pasos de la División</span>
      </div>
      <div class="timeline-steps" id="timelineList"></div>
    </div>

    <div class="grid-card">
      <div class="math-grid" id="mathGrid"></div>
    </div>
  </div>

  <!-- Barra de Operaciones con Desagrupación en Dividendo -->
  <div class="bottom-toolbar">
    <div class="bank-live-badge" title="Fichas disponibles en el dividendo">
      <span>Dividendo:</span>
      <span class="badge-pill pill-c" id="badgeCountC">0 C</span>
      <span class="badge-pill pill-d" id="badgeCountD">0 D</span>
      <span class="badge-pill pill-u" id="badgeCountU">0 U</span>
      <span style="color:#0284c7; font-weight:800;" id="badgeTotalU">(0u)</span>
    </div>

    <button class="action-btn btn-split-c" id="btnSplitC" onclick="splitBankC()" title="Canjear 1 Centena en 10 Decenas">
      <i class="fa-solid fa-scissors"></i> Canjear C (1C → 10D)
    </button>

    <button class="action-btn btn-split-d" id="btnSplitD" onclick="splitBankD()" title="Canjear 1 Decena en 10 Unidades">
      <i class="fa-solid fa-scissors"></i> Canjear D (1D → 10U)
    </button>

    <button class="action-btn btn-pack-1" id="btnPack1" onclick="packOneVisibleBox(false)">
      <i class="fa-solid fa-box-open"></i> Llenar 1 Caja (<span id="lblCost1">21u</span>)
    </button>

    <button class="action-btn btn-split-box" id="btnSplitBoxes" onclick="unpackTensInsideBoxes()">
      <i class="fa-solid fa-arrows-split-up-and-left"></i> Desagrupar D en Cajas
    </button>

    <button class="action-btn btn-step" id="btnNextStep" onclick="advanceStep()">
      <i class="fa-solid fa-forward-step"></i> Siguiente Paso
    </button>

    <button class="action-btn btn-split-bank" onclick="initSimulation()">
      <i class="fa-solid fa-rotate-left"></i> Reiniciar
    </button>
  </div>

  <script>
    /* =========================================================================
       1. ESCENA THREE.JS Y ELEMENTOS 3D
       ========================================================================= */
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf1f5f9);
    scene.fog = new THREE.FogExp2(0xf1f5f9, 0.007);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2, 58, 70);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.target.set(5, 2, 0);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xe2e8f0, 0.95);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.25);
    dirLight.position.set(28, 54, 26);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Mesa Principal Ampliada
    const tableMesh = new THREE.Mesh(
      new THREE.BoxGeometry(114, 1.5, 52),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 })
    );
    tableMesh.position.y = -0.75;
    tableMesh.receiveShadow = true;
    scene.add(tableMesh);

    // Divisoria entre Reserva y Cajas
    const divider = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.4, 48),
      new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.3 })
    );
    divider.position.set(-8, 0.2, 0);
    scene.add(divider);

    const tokensGroup = new THREE.Group();
    scene.add(tokensGroup);

    const cratesGroup = new THREE.Group();
    scene.add(cratesGroup);

    /* Texturas Fichas Base 10 */
    function createTokenTexture(label, bgHex, borderHex, textHex) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bgHex;
      ctx.beginPath(); ctx.arc(128, 128, 120, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 14; ctx.strokeStyle = borderHex; ctx.stroke();
      ctx.fillStyle = textHex;
      ctx.font = 'bold 112px Fredoka, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, 128, 134);
      return new THREE.CanvasTexture(c);
    }

    const texC = createTokenTexture('C', '#dcfce7', '#16a34a', '#15803d');
    const texD = createTokenTexture('D', '#fef9c3', '#eab308', '#854d0e');
    const texU = createTokenTexture('U', '#e0f2fe', '#0284c7', '#0369a1');

    /* DIMENSIONES DE FICHAS: DIÁMETRO 1.4, ALTURA 0.30 */
    const TOKEN_RADIUS = 0.70;
    const TOKEN_HEIGHT = 0.30;
    const geomCylinder = new THREE.CylinderGeometry(TOKEN_RADIUS, TOKEN_RADIUS, TOKEN_HEIGHT, 32);

    function createTokenMesh(type) {
      let topTex = (type === 'c') ? texC : (type === 'd' ? texD : texU);
      let sideColor = (type === 'c') ? 0x16a34a : (type === 'd' ? 0xeab308 : 0x0284c7);
      const mats = [
        new THREE.MeshStandardMaterial({ color: sideColor, roughness: 0.35 }),
        new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.25 }),
        new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.25 })
      ];
      const mesh = new THREE.Mesh(geomCylinder, mats);
      mesh.castShadow = true;
      mesh.userData = { type: type, location: 'bank', crateIdx: -1 };
      return mesh;
    }

    /* CAJA GRANDE: Ancho 12.0, Profundidad 15.0 con Bases Circulares Indicadoras */
    function createOpenCrateMesh(index, width = 12.0, depth = 15.0) {
      const crate = new THREE.Group();
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 });
      const floorMat = new THREE.MeshStandardMaterial({ color: 0xf0f9ff, roughness: 0.4 });

      const floor = new THREE.Mesh(new THREE.BoxGeometry(width, 0.15, depth), floorMat);
      floor.position.y = 0.08;
      floor.receiveShadow = true;
      crate.add(floor);

      const h = 0.85;
      const th = 0.25;

      const back = new THREE.Mesh(new THREE.BoxGeometry(width, h, th), wallMat);
      back.position.set(0, h / 2, -depth / 2); crate.add(back);

      const front = new THREE.Mesh(new THREE.BoxGeometry(width, h, th), wallMat);
      front.position.set(0, h / 2, depth / 2); crate.add(front);

      const left = new THREE.Mesh(new THREE.BoxGeometry(th, h, depth), wallMat);
      left.position.set(-width / 2, h / 2, 0); crate.add(left);

      const right = new THREE.Mesh(new THREE.BoxGeometry(th, h, depth), wallMat);
      right.position.set(width / 2, h / 2, 0); crate.add(right);

      // Bases circulares sutiles en el fondo donde se posan las pilas verticales
      const spotMat = new THREE.MeshStandardMaterial({ color: 0xbae6fd, roughness: 0.6 });
      const spotGeom = new THREE.CylinderGeometry(0.85, 0.85, 0.02, 24);

      // 6 pedestales con separación holgada de 5.2 en X y 4.2 en Z
      const colOffsetsX = [-2.8, 2.8];
      const rowOffsetsZ = [-4.2, 0, 4.2];

      colOffsetsX.forEach(ox => {
        rowOffsetsZ.forEach(oz => {
          const spot = new THREE.Mesh(spotGeom, spotMat);
          spot.position.set(ox, 0.16, oz);
          spot.receiveShadow = true;
          crate.add(spot);
        });
      });

      // Rótulo frontal exterior despejado
      const labelC = document.createElement('canvas');
      labelC.width = 256; labelC.height = 64;
      const lctx = labelC.getContext('2d');
      lctx.fillStyle = '#0369a1';
      lctx.font = 'bold 36px Fredoka, sans-serif';
      lctx.textAlign = 'center';
      lctx.fillText(`Caja ${index + 1}`, 128, 46);
      const lTex = new THREE.CanvasTexture(labelC);
      const labelMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(width * 0.6, 1.3),
        new THREE.MeshBasicMaterial({ map: lTex, transparent: true })
      );
      labelMesh.rotation.x = -Math.PI / 2;
      labelMesh.position.set(0, 0.16, depth / 2 + 1.1);
      crate.add(labelMesh);

      crate.userData = { width, depth, index };
      return crate;
    }

    /* =========================================================================
       2. ESTADO GLOBAL Y DISTRIBUCIÓN
       ========================================================================= */
    let dividend = 84;
    let divisor = 21;
    let currentStep = 0;
    let stepsList = [];

    let bankTokens = { c: [], d: [], u: [] };
    let cratesData = [];
    const activeAnimations = [];

    function preset(div, dis) {
      document.getElementById('inpDividend').value = div;
      document.getElementById('inpDivisor').value = dis;
      initSimulation();
    }

    function initSimulation() {
      dividend = parseInt(document.getElementById('inpDividend').value);
      divisor = parseInt(document.getElementById('inpDivisor').value);

      if (isNaN(dividend) || isNaN(divisor) || divisor < 10) return;

      while (tokensGroup.children.length > 0) tokensGroup.remove(tokensGroup.children[0]);
      while (cratesGroup.children.length > 0) cratesGroup.remove(cratesGroup.children[0]);
      activeAnimations.length = 0;

      bankTokens = { c: [], d: [], u: [] };
      cratesData = [];

      const countC = Math.floor(dividend / 100);
      const countD = Math.floor((dividend % 100) / 10);
      const countU = dividend % 10;

      for (let i = 0; i < countC; i++) spawnTokenInBank('c');
      for (let i = 0; i < countD; i++) spawnTokenInBank('d');
      for (let i = 0; i < countU; i++) spawnTokenInBank('u');

      document.getElementById('stepsTitle').textContent = `Pasos para ${dividend} ÷ ${divisor}`;
      document.getElementById('lblCost1').textContent = `${divisor}u`;

      generateDidacticPlan();
      currentStep = 0;
      renderTimeline();
      renderEmptyGrid();
      applyStepToGrid(0);
      reflowBank();
      updateBadgeCounts();
    }

    function spawnTokenInBank(type) {
      const tok = createTokenMesh(type);
      tokensGroup.add(tok);
      bankTokens[type].push(tok);
    }

    function snapTo(mesh, targetPos, speed = 0.22) {
      for (let i = activeAnimations.length - 1; i >= 0; i--) {
        if (activeAnimations[i].mesh === mesh) activeAnimations.splice(i, 1);
      }
      activeAnimations.push({
        mesh, startPos: mesh.position.clone(), endPos: targetPos.clone(), progress: 0, speed
      });
    }

    /* Ubicación en Reserva: Pilas puramente verticales sin amontonamiento */
    function reflowBank() {
      // Centenas: Columna en X = -43
      bankTokens.c.forEach((tok, i) => {
        const stack = Math.floor(i / 10);
        const h = i % 10;
        snapTo(tok, new THREE.Vector3(-43, 0.25 + (h * 0.32), -12 + (stack * 3.4)));
      });

      // Decenas: Columnas en X = -33 a -26
      bankTokens.d.forEach((tok, i) => {
        const stack = Math.floor(i / 10);
        const h = i % 10;
        const colX = Math.floor(stack / 7) * 2.8;
        const localStackZ = stack % 7;
        snapTo(tok, new THREE.Vector3(-33 + colX, 0.25 + (h * 0.32), -13 + (localStackZ * 3.4)));
      });

      // Unidades: Columnas en X = -22 a -12
      bankTokens.u.forEach((tok, i) => {
        const stack = Math.floor(i / 10);
        const h = i % 10;
        const colX = Math.floor(stack / 8) * 2.6;
        const localStackZ = stack % 8;
        snapTo(tok, new THREE.Vector3(-22 + colX, 0.25 + (h * 0.32), -13 + (localStackZ * 3.4)));
      });

      updateBadgeCounts();
    }

    function updateBadgeCounts() {
      const c = bankTokens.c.length;
      const d = bankTokens.d.length;
      const u = bankTokens.u.length;
      const total = (c * 100) + (d * 10) + u;

      document.getElementById('badgeCountC').textContent = `${c} C`;
      document.getElementById('badgeCountD').textContent = `${d} D`;
      document.getElementById('badgeCountU').textContent = `${u} U`;
      document.getElementById('badgeTotalU').textContent = `(${total}u)`;

      document.getElementById('btnSplitC').disabled = (c === 0);
      document.getElementById('btnSplitD').disabled = (d === 0);
    }

    /* =========================================================================
       3. DESAGRUPACIÓN EN EL DIVIDENDO (CANJE 1C → 10D y 1D → 10U)
       ========================================================================= */
    function splitBankC() {
      if (bankTokens.c.length === 0) return;
      const tokC = bankTokens.c.pop();
      const spawnPos = tokC.position.clone();
      tokensGroup.remove(tokC);

      for (let i = 0; i < 10; i++) {
        const newD = createTokenMesh('d');
        newD.position.set(spawnPos.x, spawnPos.y + 0.6 + (i * 0.15), spawnPos.z);
        tokensGroup.add(newD);
        bankTokens.d.push(newD);
      }

      reflowBank();
      playRealisticSound('exchange');
    }

    function splitBankD() {
      if (bankTokens.d.length === 0) return;
      const tokD = bankTokens.d.pop();
      const spawnPos = tokD.position.clone();
      tokensGroup.remove(tokD);

      for (let i = 0; i < 10; i++) {
        const newU = createTokenMesh('u');
        newU.position.set(spawnPos.x, spawnPos.y + 0.6 + (i * 0.15), spawnPos.z);
        tokensGroup.add(newU);
        bankTokens.u.push(newU);
      }

      reflowBank();
      playRealisticSound('exchange');
    }

    /* Soporte de Doble Clic en Escena para Desagrupar Fichas del Dividendo */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('dblclick', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(tokensGroup.children, true);
      if (intersects.length > 0) {
        let picked = intersects[0].object;
        if (picked.userData && picked.userData.location === 'bank') {
          if (picked.userData.type === 'c') splitBankC();
          else if (picked.userData.type === 'd') splitBankD();
        }
      }
    });

    /* =========================================================================
       4. LLENADO DE CAJAS GRANDES CON PILAS VERTICALES
       ========================================================================= */
    function packOneVisibleBox(autoUnbundle = false) {
      const totalBank = (bankTokens.c.length * 100) + (bankTokens.d.length * 10) + bankTokens.u.length;
      if (totalBank < divisor) {
        alert(`No alcanzan las fichas en reserva (${totalBank}u) para armar otra caja de ${divisor}u.`);
        return;
      }

      const reqD = Math.floor(divisor / 10);
      const reqU = divisor % 10;

      if (!autoUnbundle) {
        if (bankTokens.d.length < reqD && bankTokens.c.length > 0) {
          alert(`¡No tienes suficientes decenas sueltas para la caja! Usa el botón "Canjear C (1C → 10D)" para desagrupar tu centena.`);
          return;
        }
        if (bankTokens.u.length < reqU && bankTokens.d.length > 0) {
          alert(`¡Te faltan unidades sueltas! Usa el botón "Canjear D (1D → 10U)" para obtener unidades individuales.`);
          return;
        }
      } else {
        while (bankTokens.d.length < reqD && bankTokens.c.length > 0) splitBankC();
        while (bankTokens.u.length < reqU && bankTokens.d.length > 0) splitBankD();
      }

      const boxTokens = [];
      let dToTake = Math.min(reqD, bankTokens.d.length);
      let uNeeded = divisor - (dToTake * 10);

      if (bankTokens.u.length < uNeeded && bankTokens.d.length > dToTake) {
        while (bankTokens.u.length < uNeeded && bankTokens.d.length > 0) splitBankD();
        dToTake = Math.min(reqD, bankTokens.d.length);
        uNeeded = divisor - (dToTake * 10);
      }

      for (let i = 0; i < dToTake; i++) {
        const tok = bankTokens.d.pop();
        tok.userData.location = 'crate';
        tok.userData.crateIdx = cratesData.length;
        boxTokens.push(tok);
      }

      for (let i = 0; i < uNeeded; i++) {
        if (bankTokens.u.length > 0) {
          const tok = bankTokens.u.pop();
          tok.userData.location = 'crate';
          tok.userData.crateIdx = cratesData.length;
          boxTokens.push(tok);
        }
      }

      reflowBank();

      const crateIdx = cratesData.length;
      const crateMesh = createOpenCrateMesh(crateIdx);

      // Posicionamiento de las cajas amplias en la mesa
      const maxCols = 4;
      const col = crateIdx % maxCols;
      const row = Math.floor(crateIdx / maxCols);
      const crateX = 0 + (col * 13.5);
      const crateZ = -6 + (row * 16.5);

      crateMesh.position.set(crateX, 0, crateZ);
      cratesGroup.add(crateMesh);

      const crateRecord = { crateMesh, tokens: boxTokens };
      cratesData.push(crateRecord);

      reflowTokensInsideCrate(crateRecord);
      playRealisticSound('drop');
    }

    /* COLUMNAS VERTICALES PURAS: APILAMIENTO EN EL EJE Y CON SEPARACIÓN HORIZONTAL TOTAL */
    function reflowTokensInsideCrate(crateRecord) {
      const cratePos = crateRecord.crateMesh.position;
      const tokens = crateRecord.tokens;

      const dTokens = tokens.filter(t => t.userData.type === 'd');
      const uTokens = tokens.filter(t => t.userData.type === 'u');

      // Coordenadas fijas de las bases (2 columnas en X: -2.8 y +2.8; 3 filas en Z: -4.2, 0, +4.2)
      // Entre -2.8 y +2.8 hay 5.6 unidades de distancia (diámetro ficha = 1.4 -> 4.2 unidades libres de suelo!)
      const spotCoords = [
        { x: cratePos.x - 2.8, z: cratePos.z - 4.2 }, // Base 0
        { x: cratePos.x - 2.8, z: cratePos.z },       // Base 1
        { x: cratePos.x - 2.8, z: cratePos.z + 4.2 }, // Base 2
        { x: cratePos.x + 2.8, z: cratePos.z - 4.2 }, // Base 3
        { x: cratePos.x + 2.8, z: cratePos.z },       // Base 4
        { x: cratePos.x + 2.8, z: cratePos.z + 4.2 }  // Base 5
      ];

      if (dTokens.length > 0) {
        // Decenas en la columna izquierda: cada decena en su base o apiladas verticalmente
        dTokens.forEach((t, i) => {
          const base = spotCoords[i % 3];
          snapTo(t, new THREE.Vector3(base.x, 0.25, base.z));
        });

        // Unidades en la columna derecha apiladas verticalmente una sobre otra
        uTokens.forEach((t, i) => {
          const base = spotCoords[3]; // Columna derecha, base frontal
          snapTo(t, new THREE.Vector3(base.x, 0.25 + (i * 0.32), base.z));
        });
      } else {
        // TODAS SON UNIDADES (TRAS DESAGRUPAR):
        // Se apilan verticalmente en TORRES DE 10 UNIDADES (Equivalentes a 1 decena)
        // Por ejemplo, para 21: Torre 0 (10u), Torre 1 (10u), Torre 2 (1u).
        // ¡Cero amontonamiento horizontal! Cada torre tiene su propia base circular despejada.
        uTokens.forEach((t, i) => {
          const pileIdx = Math.floor(i / 10); // Cada torre almacena 10 fichas
          const heightInPile = i % 10;
          const base = spotCoords[pileIdx % spotCoords.length];

          const posX = base.x;
          const posY = 0.25 + (heightInPile * 0.32); // Apilamiento estrictamente vertical en Y
          const posZ = base.z;

          snapTo(t, new THREE.Vector3(posX, posY, posZ));
        });
      }
    }

    /* Desagrupación dentro de las cajas */
    function unpackTensInsideBoxes() {
      let unbundledAny = false;

      cratesData.forEach(crateRecord => {
        const dTokens = crateRecord.tokens.filter(t => t.userData.type === 'd');
        if (dTokens.length > 0) {
          const tokD = dTokens.pop();
          const idx = crateRecord.tokens.indexOf(tokD);
          if (idx !== -1) crateRecord.tokens.splice(idx, 1);
          tokensGroup.remove(tokD);

          const spawnPos = tokD.position.clone();

          for (let i = 0; i < 10; i++) {
            const newU = createTokenMesh('u');
            newU.userData.location = 'crate';
            newU.userData.crateIdx = crateRecord.crateMesh.userData.index;
            newU.position.set(spawnPos.x, spawnPos.y + (i * 0.15), spawnPos.z);
            tokensGroup.add(newU);
            crateRecord.tokens.push(newU);
          }

          reflowTokensInsideCrate(crateRecord);
          unbundledAny = true;
        }
      });

      if (unbundledAny) {
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        playRealisticSound('exchange');
      } else {
        alert("Ya todas las decenas en las cajas han sido desagrupadas en unidades.");
      }
    }

    /* =========================================================================
       5. SECUENCIA DIDÁCTICA Y CUADRÍCULA
       ========================================================================= */
    function generateDidacticPlan() {
      stepsList = [];
      const divStr = dividend.toString();
      const disStr = divisor.toString();
      const firstDivisorDigit = parseInt(disStr[0]);

      if (dividend < 100) {
        const dDigit = parseInt(divStr[0]);
        const estimatedQ = Math.floor(dividend / divisor);
        const product = estimatedQ * divisor;
        const rem = dividend - product;

        stepsList.push({ step: 1, title: "Comparamos las cifras de las decenas." });
        stepsList.push({ step: 2, title: `Como ${dDigit} ÷ ${firstDivisorDigit} = ${estimatedQ}, escribimos ${estimatedQ} en el cociente.` });
        stepsList.push({ step: 3, title: `Calculamos ${estimatedQ} x ${divisor} = ${product}, restamos ${dividend} - ${product} = ${rem}.` });
        stepsList.push({ step: 4, title: `El cociente es ${estimatedQ} y el residuo es ${rem}.` });
      } else {
        const firstTwo = parseInt(divStr.slice(0, 2));
        if (firstTwo >= divisor) {
          const q1 = Math.floor(firstTwo / divisor);
          const prod1 = q1 * divisor;
          const rem1 = firstTwo - prod1;
          const thirdDigit = divStr[2];
          const val2 = rem1 * 10 + parseInt(thirdDigit);
          const q2 = Math.floor(val2 / divisor);
          const prod2 = q2 * divisor;
          const rem2 = val2 - prod2;

          stepsList.push({ step: 1, title: `Como ${firstTwo} ≥ ${divisor}, tomamos las 2 primeras cifras (${firstTwo}). Escribimos ${q1} en las decenas del cociente.` });
          stepsList.push({ step: 2, title: `Multiplicamos ${q1} × ${divisor} = ${prod1}. Restamos ${firstTwo} - ${prod1} = ${rem1}.` });
          stepsList.push({ step: 3, title: `Bajamos la siguiente cifra (${thirdDigit}) formando el ${val2}.` });
          stepsList.push({ step: 4, title: `Dividimos ${val2} ÷ ${divisor} = ${q2}. Escribimos ${q2} en las unidades del cociente.` });
          stepsList.push({ step: 5, title: `Restamos ${val2} - ${prod2} = ${rem2}. Cociente: ${Math.floor(dividend/divisor)}, Residuo: ${rem2}.` });
        } else {
          const q = Math.floor(dividend / divisor);
          const prod = q * divisor;
          const rem = dividend - prod;
          stepsList.push({ step: 1, title: `Como ${firstTwo} < ${divisor}, tomamos las 3 cifras (${dividend}).` });
          stepsList.push({ step: 2, title: `Estimamos ${firstTwo} ÷ ${firstDivisorDigit} y probamos con ${q} en el cociente.` });
          stepsList.push({ step: 3, title: `Multiplicamos ${q} × ${divisor} = ${prod}. Restamos ${dividend} - ${prod} = ${rem}.` });
          stepsList.push({ step: 4, title: `El cociente es ${q} y el residuo es ${rem}.` });
        }
      }
    }

    function renderTimeline() {
      const list = document.getElementById('timelineList');
      list.innerHTML = '';
      stepsList.forEach((st, idx) => {
        const item = document.createElement('div');
        item.className = `step-item ${idx <= currentStep ? 'active' : ''}`;
        item.innerHTML = `
          <div class="step-num">${st.step}</div>
          <div class="step-desc">${st.title}</div>
        `;
        list.appendChild(item);
      });
    }

    function renderEmptyGrid() {
      const grid = document.getElementById('mathGrid');
      grid.innerHTML = '';
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.id = `g_${r}_${c}`;
          grid.appendChild(cell);
        }
      }

      if (dividend < 100) {
        setGrid(0, 1, 'D', 'cell-d');
        setGrid(0, 2, 'U', 'cell-u');
        drawGalera(3);
      } else {
        setGrid(0, 0, 'C', 'cell-c');
        setGrid(0, 1, 'D', 'cell-d');
        setGrid(0, 2, 'U', 'cell-u');
        drawGalera(3);
      }
    }

    function setGrid(r, c, text, cls = '') {
      const el = document.getElementById(`g_${r}_${c}`);
      if (el) {
        el.textContent = text;
        if (cls) el.className = `grid-cell ${cls}`;
      }
    }

    function drawGalera(divisorCol) {
      const grid = document.getElementById('mathGrid');
      const CELL = 40;
      const v = document.createElement('div');
      v.className = 'divisor-line-v';
      v.style.left = `${divisorCol * CELL}px`;
      v.style.top = `${1 * CELL}px`;
      v.style.height = `${CELL + 2}px`;
      grid.appendChild(v);

      const h = document.createElement('div');
      h.className = 'divisor-line-h';
      h.style.left = `${divisorCol * CELL}px`;
      h.style.top = `${2 * CELL}px`;
      h.style.width = `${3 * CELL}px`;
      grid.appendChild(h);
    }

    function drawMinusLine(row, startCol, endCol) {
      const grid = document.getElementById('mathGrid');
      const CELL = 40;
      const m = document.createElement('div');
      m.className = 'minus-line';
      m.style.left = `${startCol * CELL + 3}px`;
      m.style.top = `${(row + 1) * CELL}px`;
      m.style.width = `${(endCol - startCol + 1) * CELL - 6}px`;
      grid.appendChild(m);
    }

    function applyStepToGrid(stepIdx) {
      const divStr = dividend.toString();
      const disStr = divisor.toString();

      if (dividend < 100) {
        setGrid(1, 1, divStr[0]);
        setGrid(1, 2, divStr[1]);
        setGrid(1, 3, disStr[0]);
        setGrid(1, 4, disStr[1]);

        if (stepIdx >= 1) {
          const qVal = Math.floor(dividend / divisor);
          setGrid(2, 3, qVal.toString());
          setGrid(3, 3, 'U', 'cell-u');
        }
        if (stepIdx >= 2) {
          const qVal = Math.floor(dividend / divisor);
          const prodStr = (qVal * divisor).toString();
          setGrid(2, 0, '—');
          setGrid(2, 1, prodStr[0], 'sub-digit');
          setGrid(2, 2, prodStr[1], 'sub-digit');
          drawMinusLine(2, 0, 2);

          const rem = dividend % divisor;
          setGrid(3, 2, rem.toString());
        }
      } else {
        setGrid(1, 0, divStr[0]);
        setGrid(1, 1, divStr[1]);
        setGrid(1, 2, divStr[2]);
        setGrid(1, 3, disStr[0]);
        setGrid(1, 4, disStr[1]);

        const firstTwo = parseInt(divStr.slice(0, 2));
        if (firstTwo >= divisor) {
          const q1 = Math.floor(firstTwo / divisor);
          const prod1 = (q1 * divisor).toString();
          const rem1 = firstTwo - (q1 * divisor);

          if (stepIdx >= 1) {
            setGrid(2, 3, q1.toString());
            setGrid(3, 3, 'D', 'cell-d');
          }
          if (stepIdx >= 2) {
            setGrid(2, 0, prod1[0], 'sub-digit');
            setGrid(2, 1, prod1[1], 'sub-digit');
            drawMinusLine(2, 0, 1);
            setGrid(3, 1, rem1.toString());
          }
          if (stepIdx >= 3) {
            setGrid(3, 2, divStr[2]);
          }
          if (stepIdx >= 4) {
            const val2 = rem1 * 10 + parseInt(divStr[2]);
            const q2 = Math.floor(val2 / divisor);
            const prod2 = (q2 * divisor).toString();
            const rem2 = val2 - (q2 * divisor);

            setGrid(2, 4, q2.toString());
            setGrid(3, 4, 'U', 'cell-u');
            setGrid(4, 1, prod2[0], 'sub-digit');
            setGrid(4, 2, prod2[1], 'sub-digit');
            drawMinusLine(4, 1, 2);
            setGrid(5, 2, rem2.toString());
          }
        } else {
          const q = Math.floor(dividend / divisor);
          const prod = (q * divisor).toString();
          const rem = dividend - (q * divisor);

          if (stepIdx >= 1) {
            setGrid(2, 3, q.toString());
            setGrid(3, 3, 'U', 'cell-u');
          }
          if (stepIdx >= 2) {
            setGrid(2, 0, prod[0], 'sub-digit');
            setGrid(2, 1, prod[1], 'sub-digit');
            setGrid(2, 2, prod[2] || '', 'sub-digit');
            drawMinusLine(2, 0, 2);
            setGrid(3, 2, rem.toString());
          }
        }
      }
    }

    function advanceStep() {
      if (currentStep < stepsList.length - 1) {
        currentStep++;
        renderTimeline();
        applyStepToGrid(currentStep);

        if (currentStep === 2) {
          const q = Math.floor(dividend / divisor);
          for (let i = 0; i < q; i++) {
            setTimeout(() => packOneVisibleBox(true), i * 160);
          }
          confetti({ particleCount: 70, spread: 70, origin: { y: 0.6 } });
        }
      }
    }

    /* Síntesis Sonora */
    let audioCtx = null;
    function playRealisticSound(type) {
      try {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioClass();
        const now = audioCtx.currentTime;

        if (type === 'exchange') {
          for (let i = 0; i < 4; i++) {
            setTimeout(() => {
              const osc = audioCtx.createOscillator();
              const g = audioCtx.createGain();
              osc.frequency.setValueAtTime(2600 + Math.random() * 400, audioCtx.currentTime);
              g.gain.setValueAtTime(0.18, audioCtx.currentTime);
              g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
              osc.connect(g); g.connect(audioCtx.destination);
              osc.start(); osc.stop(now + 0.045);
            }, i * 30);
          }
        } else if (type === 'drop') {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
          g.gain.setValueAtTime(0.25, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(); osc.stop(now + 0.055);
        }
      } catch(e) {}
    }

    /* Bucle Render */
    function animate() {
      requestAnimationFrame(animate);

      for (let i = activeAnimations.length - 1; i >= 0; i--) {
        const anim = activeAnimations[i];
        anim.progress += anim.speed;
        if (anim.progress >= 1) {
          anim.mesh.position.copy(anim.endPos);
          activeAnimations.splice(i, 1);
        } else {
          const ease = Math.sin(anim.progress * (Math.PI / 2));
          anim.mesh.position.lerpVectors(anim.startPos, anim.endPos, ease);
          anim.mesh.position.y += Math.sin(anim.progress * Math.PI) * 1.5;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('DOMContentLoaded', () => {
      animate();
      initSimulation();
    });
  </script>
</body>
